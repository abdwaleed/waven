site_name: waven
site_description: Scientific documentation for Gabor-wavelet analysis of neural responses.
site_dir: site
docs_dir: docs
repo_url: https://github.com/abdwaleed/waven

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Switch to light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to system preference}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
              warn_unknown_params: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            inherited_members: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start Here: index.md
  - Onboarding:
      - First GUI Analysis: tutorials/first-gui-analysis.md
      - Install and Launch: how-to/install.md
      - Experiment Folder: reference/project-layout.md
  - Configure:
      - pipeline_config.json and Scientific Settings: how-to/prepare-configuration.md
      - Cache Storage and Disk Planning: reference/storage.md
  - Run and Export:
      - GUI Workflow and System Configuration: reference/gui.md
      - Inputs, Outputs, and Cache Contracts: reference/data-contracts.md
      - Export Results: how-to/export-results.md
  - Understand and Maintain:
      - Scientific Intuition: explanation/pipeline-intuition.md
      - Source Architecture and Ownership: reference/source-architecture.md
      - Maintainability Guide: explanation/maintainability.md
  - FAQ: faq.md
